[project]
name = "sevim"
version = "0.1.0"
description = "Semantic-graph + deterministic layout + minimal shape grammar → SVG whiteboard"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
embed = ["sentence-transformers>=2.3", "torch>=2"]
book = ["pymupdf>=1.24"]

[project.scripts]
sevim = "sevim.cli:main"
sevim-ingest = "book.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sevim*", "book*"]

[tool.pytest.ini_options]
pythonpath = ["."]
